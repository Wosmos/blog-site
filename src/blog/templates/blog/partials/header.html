<!-- Centralized Header Component -->
<nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            
            <!-- Left Side: Brand & Navigation -->
            <div class="flex items-center gap-4">
                <!-- Mobile Menu Button (if drawer exists) -->
                {% if use_sidebar %}
                <button @click="toggleDrawer()" class="lg:hidden p-2 text-stone-500 hover:bg-stone-100 rounded-lg">
                    <i class="fas fa-bars"></i>
                </button>
                {% endif %}

                <a href="{% url 'blog:admin_dashboard' %}" class="flex items-center gap-3 transition-transform hover:scale-102">
                    <div class="h-8 w-8 bg-stone-900 text-white flex items-center justify-center rounded-lg shadow-sm">
                        <i class="fas fa-feather-alt text-sm"></i>
                    </div>
                    <span class="text-lg font-serif font-bold tracking-tight">Admin<span class="text-indigo-600">.</span></span>
                </a>
                
                <!-- Quick Navigation Links (Optional) -->
                <div class="hidden md:ml-6 md:flex md:space-x-4">
                    <a href="{% url 'blog:list' %}" class="inline-flex items-center px-1 pt-1 text-sm font-bold {% if 'posts' in request.path %}text-indigo-600 border-b-2 border-indigo-600{% else %}text-stone-500 hover:text-stone-900{% endif %} transition-all">
                        Posts
                    </a>
                </div>
            </div>

            <!-- Right Side: Action Buttons & User Profile -->
            <div class="flex items-center gap-4">
                
                <!-- Active Dashboard Indicator (Mock) -->
                <div class="hidden sm:flex items-center gap-2 px-3 py-1 bg-green-50 rounded-full border border-green-100">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] font-bold text-green-700 uppercase tracking-widest">Active</span>
                </div>

                <!-- User Dropdown (Alpine.js) -->
                <div class="relative" x-data="{ open: false }" @click.away="open = false">
                    <button @click="open = !open" class="flex items-center gap-2 p-1 rounded-full hover:bg-stone-100 transition-all border border-transparent hover:border-stone-200">
                        <div class="h-8 w-8 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-xs ring-2 ring-white ring-offset-1">
                            {{ user.username|first|upper }}
                        </div>
                        <span class="hidden sm:block text-sm font-bold text-stone-700 mr-1">{{ user.get_full_name|default:user.username }}</span>
                        <i class="fas fa-chevron-down text-[10px] text-stone-400 transition-transform" :class="open ? 'rotate-180' : ''"></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div x-show="open" 
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="transform opacity-0 scale-95"
                         x-transition:enter-end="transform opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="transform opacity-100 scale-100"
                         x-transition:leave-end="transform opacity-0 scale-95"
                         class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-2xl border border-stone-200 overflow-hidden z-50 py-1"
                         style="display: none;">
                        
                        <div class="px-4 py-3 border-b border-stone-100 bg-stone-50/50">
                            <p class="text-xs text-stone-400 font-bold uppercase tracking-widest mb-1">Signed in as</p>
                            <p class="text-sm font-bold text-stone-800 truncate">{{ user.email|default:user.username }}</p>
                        </div>

                        <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-stone-600 hover:bg-stone-50 hover:text-indigo-600 transition-colors">
                            <i class="fas fa-user-circle text-stone-400"></i> My Profile
                        </a>
                        <a href="{% url 'blog:admin_dashboard' %}" class="flex items-center gap-3 px-4 py-2 text-sm text-stone-600 hover:bg-stone-50 transition-colors">
                            <i class="fas fa-columns text-stone-400"></i> Dashboard
                        </a>
                        
                        <div class="h-px bg-stone-100 my-1"></div>

                        <a href="{% url 'blog:admin_logout' %}" class="flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-bold transition-colors">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
