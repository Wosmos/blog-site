<nav class="sticky top-0 z-50 bg-white/90 dark:bg-stone-950/90 backdrop-blur-xl border-b border-stone-200/60 dark:border-stone-800/60 transition-colors duration-500"
     x-data="{ open: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10">
        <div class="flex justify-between h-20"> <div class="flex items-center gap-6">
                {% if use_sidebar %}
                <button @click="toggleDrawer()" class="lg:hidden p-2 text-stone-500 hover:bg-stone-100 dark:hover:bg-stone-800 rounded-xl transition-all">
                    <i class="fas fa-bars-staggered"></i>
                </button>
                {% endif %}

                <a href="{% url 'blog:admin_dashboard' %}" class="group flex items-center gap-3">
                    <div class="relative h-10 w-10 bg-stone-900 dark:bg-stone-100 rounded-xl flex items-center justify-center overflow-hidden transition-all duration-500 group-hover:rotate-[10deg] group-hover:scale-110 shadow-lg shadow-stone-200 dark:shadow-none">
                        <i class="fas fa-feather-pointed text-white dark:text-stone-900 text-sm transition-transform duration-500 group-hover:-translate-y-1 group-hover:translate-x-1"></i>
                        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                    </div>
                    <div class="hidden sm:flex flex-col">
                        <span class="text-sm font-black uppercase tracking-[0.3em] text-stone-900 dark:text-stone-100 leading-none">Admin</span>
                        <span class="text-[9px] font-bold uppercase tracking-widest text-indigo-600 dark:text-indigo-400 mt-1">Command Center</span>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-4 sm:gap-8">
                
                <div class="relative flex items-center bg-stone-100 dark:bg-stone-800 rounded-full p-1 w-14 h-8 cursor-pointer border border-stone-200 dark:border-stone-700 transition-all duration-500"
                     @click="toggleTheme()">
                    <div class="absolute h-6 w-6 bg-white dark:bg-stone-950 rounded-full shadow-md transform transition-all duration-500 flex items-center justify-center"
                         :class="isDark ? 'translate-x-6' : 'translate-x-0'">
                        <i class="fas text-[10px]" 
                           :class="isDark ? 'fa-moon text-indigo-400' : 'fa-sun text-amber-500'"></i>
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-3 px-4 py-2 bg-stone-50 dark:bg-stone-900/50 rounded-2xl border border-stone-100 dark:border-stone-800">
                    <div class="flex items-end gap-[2px] h-3">
                        <div class="w-[3px] bg-green-500 rounded-full animate-bar-1"></div>
                        <div class="w-[3px] bg-green-500 rounded-full animate-bar-2"></div>
                        <div class="w-[3px] bg-green-500 rounded-full animate-bar-3"></div>
                    </div>
                    <span class="text-[10px] font-black text-stone-500 dark:text-stone-400 uppercase tracking-widest">System Live</span>
                </div>

                <div class="relative" @click.away="open = false">
                    <button @click="open = !open" 
                            class="group flex items-center gap-3 p-1 pr-3 rounded-2xl hover:bg-stone-100 dark:hover:bg-stone-800/50 transition-all duration-300 border border-transparent hover:border-stone-200 dark:hover:border-stone-800">
                        <div class="relative">
                            <div class="h-9 w-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xs shadow-lg shadow-indigo-200 dark:shadow-none transition-transform group-hover:scale-105">
                                {{ user.username|first|upper }}
                            </div>
                            <div class="absolute -top-1 -right-1 flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 border-2 border-white dark:border-stone-950 bg-indigo-500"></span>
                            </div>
                        </div>
                        <div class="hidden lg:block text-left">
                            <p class="text-xs font-black text-stone-900 dark:text-stone-100 leading-none mb-0.5">{{ user.username|title }}</p>
                            <p class="text-[9px] font-bold text-stone-400 uppercase tracking-tighter">Root Session</p>
                        </div>
                        <i class="fas fa-chevron-down text-[10px] text-stone-300 transition-transform duration-300" :class="open ? 'rotate-180' : ''"></i>
                    </button>

                    <div x-show="open" 
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 translate-y-4 scale-95"
                         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                         class="absolute right-0 mt-4 w-60 bg-white dark:bg-stone-900 rounded-[1.5rem] shadow-2xl border border-stone-200 dark:border-stone-800 overflow-hidden py-2"
                         style="display: none;">
                        
                        <div class="px-5 py-4 bg-stone-50/50 dark:bg-stone-800/30 border-b border-stone-100 dark:border-stone-800 mb-2">
                            <p class="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">Signed Identity</p>
                            <p class="text-xs font-bold text-stone-800 dark:text-stone-200 truncate">{{ user.email|default:user.username }}</p>
                        </div>

                        <div class="px-2 space-y-1">
                            <a href="#" class="flex items-center justify-between px-4 py-2.5 text-xs font-bold text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all rounded-xl">
                                <span class="flex items-center gap-3"><i class="fas fa-user-circle opacity-50"></i> Profile</span>
                                <i class="fas fa-arrow-right text-[10px] opacity-0 -translate-x-2 transition-all"></i>
                            </a>
                            <a href="{% url 'blog:admin_logout' %}" class="flex items-center gap-3 px-4 py-2.5 text-xs font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all rounded-xl">
                                <i class="fas fa-power-off"></i> End Session
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<style>
    /* VU Meter Animations */
    @keyframes bar-grow {
        0%, 100% { height: 4px; opacity: 0.5; }
        50% { height: 12px; opacity: 1; }
    }
    .animate-bar-1 { animation: bar-grow 1s ease-in-out infinite; }
    .animate-bar-2 { animation: bar-grow 1.2s ease-in-out infinite 0.2s; }
    .animate-bar-3 { animation: bar-grow 0.8s ease-in-out infinite 0.4s; }

    /* Show arrow on link hover inside dropdown */
    .group:hover .fa-arrow-right, a:hover .fa-arrow-right {
        opacity: 0.5;
        transform: translateX(0);
    }
</style>
