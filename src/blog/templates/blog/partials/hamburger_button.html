<!-- Hamburger Menu Button (Mobile Only) -->
<button 
    @click="toggleDrawer()"
    @keydown.enter="toggleDrawer()"
    @keydown.space.prevent="toggleDrawer()"
    class="lg:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500 transition-colors"
    aria-label="Toggle navigation menu"
    :aria-expanded="drawerOpen"
    aria-controls="mobile-sidebar"
>
    <span class="sr-only">Open main menu</span>
    <!-- Hamburger Icon -->
    <div class="w-6 h-6 flex flex-col justify-center items-center">
        <span 
            class="block w-5 h-0.5 bg-current transform transition-transform duration-300 ease-in-out"
            :class="{ 'rotate-45 translate-y-1': drawerOpen, '-translate-y-1': !drawerOpen }"
        ></span>
        <span 
            class="block w-5 h-0.5 bg-current transform transition-opacity duration-300 ease-in-out mt-1"
            :class="{ 'opacity-0': drawerOpen, 'opacity-100': !drawerOpen }"
        ></span>
        <span 
            class="block w-5 h-0.5 bg-current transform transition-transform duration-300 ease-in-out mt-1"
            :class="{ '-rotate-45 -translate-y-1': drawerOpen, 'translate-y-1': !drawerOpen }"
        ></span>
    </div>
</button>
