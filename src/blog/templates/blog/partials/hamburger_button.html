<button 
    @click="toggleDrawer()"
    @keydown.enter="toggleDrawer()"
    @keydown.space.prevent="toggleDrawer()"
    class="lg:hidden relative inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white border border-slate-100 text-slate-900 hover:bg-slate-50 active:scale-90 transition-all duration-300 shadow-sm"
    aria-label="Toggle navigation menu"
    :aria-expanded="drawerOpen"
    aria-controls="mobile-sidebar"
>
    <span class="sr-only">Open main menu</span>
    
    <div class="relative w-5 h-5 flex flex-col justify-center items-center">
        <span 
            class="block absolute h-[2px] bg-current transition-all duration-500 ease-in-out"
            :class="{ 
                'w-5 rotate-45': drawerOpen, 
                'w-5 -translate-y-1.5': !drawerOpen 
            }"
        ></span>
        
        <span 
            class="block absolute h-[2px] bg-current transition-all duration-500 ease-in-out"
            :class="{ 
                'w-0 opacity-0': drawerOpen, 
                'w-3 opacity-100': !drawerOpen 
            }"
        ></span>
        
        <span 
            class="block absolute h-[2px] bg-current transition-all duration-500 ease-in-out"
            :class="{ 
                'w-5 -rotate-45': drawerOpen, 
                'w-4 translate-y-1.5': !drawerOpen 
            }"
        ></span>
    </div>
</button>
