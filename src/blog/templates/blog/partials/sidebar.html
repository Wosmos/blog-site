<aside 
    id="mobile-sidebar"
    class="w-72 bg-white min-h-screen fixed left-0 top-0 z-40 transform transition-all duration-500 cubic-bezier(0.4, 0, 0.2, 1) lg:translate-x-0 lg:static border-r border-slate-100 paper-texture"
    :class="{
        'translate-x-0 shadow-2xl': drawerOpen,
        '-translate-x-full': !drawerOpen
    }"
    x-show="drawerOpen || !isMobile"
>


    <nav class="mt-10 px-6">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-6 px-2">Main Registry</p>
        
        <ul class="space-y-1">
            <li>
                <a 
                    href="{% url 'blog:admin_dashboard' %}" 
                    class="group flex items-center px-4 py-3 text-[13px] font-bold tracking-tight rounded-xl transition-all duration-300
                    {% if request.resolver_match.url_name == 'admin_dashboard' %}
                        bg-slate-900 text-white shadow-lg shadow-slate-200
                    {% else %}
                        text-slate-500 hover:text-slate-900 hover:bg-slate-50
                    {% endif %}"
                    @click="isMobile && closeDrawer()"
                >
                    <i class="fa-solid fa-house-chimney mr-3 text-[14px] transition-transform group-hover:-rotate-12"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a 
                    href="{% url 'blog:list' %}" 
                    class="group flex items-center px-4 py-3 text-[13px] font-bold tracking-tight rounded-xl transition-all duration-300
                    {% if request.resolver_match.url_name == 'list' %}
                        bg-slate-900 text-white shadow-lg shadow-slate-200
                    {% else %}
                        text-slate-500 hover:text-slate-900 hover:bg-slate-50
                    {% endif %}"
                    @click="isMobile && closeDrawer()"
                >
                    <i class="fa-solid fa-layer-group mr-3 text-[14px]"></i>
                    Archive
                </a>
            </li>

            <li class="pt-4">
                <a 
                    href="{% url 'blog:create' %}" 
                    class="group flex items-center px-4 py-3 text-[13px] font-bold tracking-tight rounded-xl border border-dashed border-slate-200 text-slate-400 hover:border-indigo-500 hover:text-indigo-600 hover:bg-indigo-50/30 transition-all duration-300"
                    @click="isMobile && closeDrawer()"
                >
                    <i class="fa-solid fa-plus-circle mr-3 text-[14px]"></i>
                    Draft New Entry
                </a>
            </li>
        </ul>

        <div class="absolute bottom-8 left-8 right-8 p-4 bg-slate-50 rounded-2xl border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-200 border border-white"></div>
                <div>
                    <p class="text-[11px] font-black text-slate-900 uppercase">Editor v2</p>
                    <p class="text-[10px] text-slate-400 font-medium">Session Active</p>
                </div>
            </div>
        </div>
    </nav>
</aside>

<div 
    x-show="drawerOpen && isMobile"
    x-transition:enter="transition-opacity ease-out duration-500"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition-opacity ease-in duration-400"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-30 lg:hidden"
    @click="closeDrawer()"
></div>
